<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consumo de API GraphQL — React</title>

  <style>
    :root {
      --accent: #00f0ff;
      --accent2: #ff00aa;
      --accent3: #a200ff;
      --text-light: #e0e0ff;
      --text-dim: #a0a0c0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      background-size: 400% 400%;
      animation: bgShift 20s ease infinite;
      color: var(--text-light);
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.4;
      z-index: 0;
      animation: float 25s infinite alternate;
      pointer-events: none;
    }
    body::before {
      width: 500px; height: 500px;
      background: var(--accent2);
      top: -200px; left: -200px;
    }
    body::after {
      width: 600px; height: 600px;
      background: var(--accent);
      bottom: -300px; right: -200px;
      animation-delay: -10s;
    }

    @keyframes bgShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(100px, 50px) scale(1.2); }
    }

    #root { position: relative; z-index: 1; width: 100%; max-width: 900px; }

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    header h1 {
      font-size: 2.6rem;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: gradientText 5s ease infinite;
      text-shadow: 0 0 40px rgba(0, 240, 255, 0.3);
      margin-bottom: 8px;
    }
    header p {
      color: var(--text-dim);
      font-size: 0.95rem;
    }

    @keyframes gradientText {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .botoes {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    button {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-light);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    button:hover {
      background: rgba(0, 240, 255, 0.15);
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
      transform: translateY(-2px);
    }

    button:active { transform: scale(0.97); }

    button.ativo {
      background: linear-gradient(90deg, var(--accent), var(--accent3));
      color: #0b0b1a;
      border-color: transparent;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
    }

    #status {
      text-align: center;
      min-height: 30px;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .loading {
      color: var(--accent);
      animation: blink 1.4s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .erro {
      color: #ff6b6b;
      background: rgba(255, 0, 0, 0.1);
      border: 1px solid rgba(255, 0, 0, 0.3);
      padding: 12px 20px;
      border-radius: 12px;
      display: inline-block;
    }

    .card {
      background: rgba(20, 26, 50, 0.55);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      animation: cardEnter 0.6s ease backwards;
    }

    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card-header {
      padding: 16px 24px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #0b0b1a;
      letter-spacing: 1px;
    }

    .card-header.alunos { background: linear-gradient(90deg, var(--accent), #7dd3fc); }
    .card-header.cursos { background: linear-gradient(90deg, var(--accent2), #f472b6); }
    .card-header.professores { background: linear-gradient(90deg, var(--accent3), #c084fc); }

    .card-body { padding: 6px 0; }

    .item {
      padding: 16px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      transition: background 0.3s ease, transform 0.3s ease;
      animation: cardEnter 0.5s ease backwards;
    }

    .item:last-child { border-bottom: none; }

    .item:hover {
      background: rgba(0, 240, 255, 0.05);
      transform: translateX(6px);
    }

    .item strong {
      display: block;
      font-size: 1.05rem;
      color: #fff;
      margin-bottom: 4px;
    }

    .item span {
      color: var(--text-dim);
      font-size: 0.9rem;
    }

    .tag {
      display: inline-block;
      background: rgba(0, 240, 255, 0.15);
      color: var(--accent);
      font-size: 0.8rem;
      padding: 3px 10px;
      border-radius: 999px;
      margin-top: 8px;
      border: 1px solid rgba(0, 240, 255, 0.3);
    }

    .tag.rosa {
      background: rgba(255, 0, 170, 0.15);
      color: #ff7ad1;
      border-color: rgba(255, 0, 170, 0.3);
    }

    @media (max-width: 600px) {
      header h1 { font-size: 1.8rem; }
      button { padding: 10px 18px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <!-- React via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState } = React;

    const GRAPHQL_ENDPOINT = "https://testing-graphql.onrender.com/graphql";

    // ======================================================
    // FUNÇÃO QUE FAZ A CONSULTA GRAPHQL
    // ======================================================
    async function fazerQuery(query) {
      const resposta = await fetch(GRAPHQL_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query })
      });
      const resultado = await resposta.json();
      if (resultado.errors) throw new Error(resultado.errors[0].message);
      return resultado.data;
    }

    // ======================================================
    // QUERIES
    // ======================================================
    const QUERY_ALUNOS = `
      query {
        students {
          id
          name
          email
          course { name }
        }
      }
    `;

    const QUERY_CURSOS = `
      query {
        courses {
          id
          name
          credits
          students { name }
        }
      }
    `;

    const QUERY_PROFESSORES = `
      query {
        teachers {
          id
          name
          courses { name }
        }
      }
    `;

    // ======================================================
    // COMPONENTE: Card de Alunos
    // ======================================================
    function CardAlunos({ alunos }) {
      return (
        <div className="card">
          <div className="card-header alunos">LISTA DE ALUNOS</div>
          <div className="card-body">
            {alunos.map((a, i) => (
              <div
                className="item"
                key={a.id}
                style={{ animationDelay: `${i * 0.05}s` }}
              >
                <strong>{a.name}</strong>
                <span>{a.email}</span>
                <br />
                <span className="tag">{a.course ? a.course.name : "Sem curso"}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ======================================================
    // COMPONENTE: Card de Cursos
    // ======================================================
    function CardCursos({ cursos }) {
      return (
        <div className="card">
          <div className="card-header cursos">LISTA DE CURSOS</div>
          <div className="card-body">
            {cursos.map((c, i) => {
              const nomes =
                c.students && c.students.length > 0
                  ? c.students.map((s) => s.name).join(", ")
                  : "Nenhum aluno";
              return (
                <div
                  className="item"
                  key={c.id}
                  style={{ animationDelay: `${i * 0.05}s` }}
                >
                  <strong>{c.name}</strong>
                  <span>{c.credits} créditos</span>
                  <br />
                  <span style={{ fontSize: "0.88rem" }}>
                    <strong style={{ display: "inline", color: "#ff7ad1" }}>Alunos: </strong>
                    {nomes}
                  </span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ======================================================
    // COMPONENTE: Card de Professores
    // ======================================================
    function CardProfessores({ professores }) {
      return (
        <div className="card">
          <div className="card-header professores">LISTA DE PROFESSORES</div>
          <div className="card-body">
            {professores.map((p, i) => {
              const materias =
                p.courses && p.courses.length > 0
                  ? p.courses.map((c) => c.name).join(", ")
                  : "Nenhum curso";
              return (
                <div
                  className="item"
                  key={p.id}
                  style={{ animationDelay: `${i * 0.05}s` }}
                >
                  <strong>{p.name}</strong>
                  <span style={{ fontSize: "0.9rem" }}>
                    <strong style={{ display: "inline", color: "#c084fc" }}>Leciona: </strong>
                    {materias}
                  </span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ======================================================
    // APP PRINCIPAL
    // ======================================================
    function App() {
      const [tipo, setTipo] = useState(null);       // alunos | cursos | professores
      const [dados, setDados] = useState(null);
      const [carregando, setCarregando] = useState(false);
      const [erro, setErro] = useState(null);

      async function carregar(qual) {
        setTipo(qual);
        setCarregando(true);
        setErro(null);
        setDados(null);

        const queries = {
          alunos: QUERY_ALUNOS,
          cursos: QUERY_CURSOS,
          professores: QUERY_PROFESSORES
        };

        try {
          const data = await fazerQuery(queries[qual]);
          const chave = Object.keys(data)[0];
          setDados(data[chave]);
        } catch (e) {
          setErro(e.message);
        } finally {
          setCarregando(false);
        }
      }

      return (
        <>
          <header>
            <h1>API GraphQL</h1>
            <p>Escola Manoel Ignácio — Desenvolvimento de Sistemas — 3ª série B</p>
          </header>

          <div className="botoes">
            <button
              className={tipo === "alunos" ? "ativo" : ""}
              onClick={() => carregar("alunos")}
            >
              Listar Alunos
            </button>
            <button
              className={tipo === "cursos" ? "ativo" : ""}
              onClick={() => carregar("cursos")}
            >
              Listar Cursos
            </button>
            <button
              className={tipo === "professores" ? "ativo" : ""}
              onClick={() => carregar("professores")}
            >
              Listar Professores
            </button>
          </div>

          <div id="status">
            {carregando && <span className="loading">Carregando dados...</span>}
            {erro && <span className="erro">Erro: {erro}</span>}
          </div>

          <div id="resultado">
            {dados && tipo === "alunos" && <CardAlunos alunos={dados} />}
            {dados && tipo === "cursos" && <CardCursos cursos={dados} />}
            {dados && tipo === "professores" && <CardProfessores professores={dados} />}
          </div>
        </>
      );
    }

    // ======================================================
    // RENDERIZAÇÃO
    // ======================================================
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

</body>
</html>
